name: Deploy Live Showcase to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Artifact
        run: |
          mkdir -p _site
          cp -r web/* _site/
          mkdir -p _site/diagrams
          cp -r diagrams/* _site/diagrams/
          mkdir -p _site/test_evidence
          cp -r test_evidence/* _site/test_evidence/
          mkdir -p _site/docs
          cp -r docs/* _site/docs/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
